        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}

        if (pts >= 500) return { name: 'Gold', badge: 'bg-amber-500 text-white', color: 'from-amber-400 to-yellow-600' };
        return { name: 'Silver', badge: 'bg-slate-400 text-white', color: 'from-slate-300 to-slate-400' };
      }, [currentUser]);

      const handleOpenDetail = (product) => {
        setSelectedProduct(product);
        setSugarLevel('Normal Sugar');
        setOrderNotes('');
        setItemQty(1);
      };

      const handleAddToCart = () => {
        if (!selectedProduct) return;
        const cartItem = {
          cartItemId: Date.now().toString(),
          productId: selectedProduct.id,
          name: selectedProduct.name,
          price: selectedProduct.price,
          image: selectedProduct.image,
          sugarLevel: sugarLevel,
          notes: orderNotes,
          qty: itemQty
        };

        setCart(prev => {
          const existingIdx = prev.findIndex(
            i => i.productId === cartItem.productId && i.sugarLevel === cartItem.sugarLevel && i.notes === cartItem.notes
          );
          if (existingIdx > -1) {
            const updated = [...prev];
            updated[existingIdx].qty += itemQty;
            return updated;
          }
          return [...prev, cartItem];
        });

        setSelectedProduct(null);
        showToast(`${itemQty}x "${selectedProduct.name}" ditambahkan ke keranjang!`);
      };

      const updateCartQty = (cartItemId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.qty + delta;
            return newQty > 0 ? { ...item, qty: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const totalCartCount = useMemo(() => cart.reduce((sum, item) => sum + item.qty, 0), [cart]);
      const subtotalCart = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.qty), 0), [cart]);

      const discountAmount = useMemo(() => {
        if (!selectedVoucher) return 0;
        if (selectedVoucher.type === 'percent') {
          return Math.round((subtotalCart * (selectedVoucher.discountPercent || 0)) / 100);
        }
        return selectedVoucher.discountAmount || 0;
      }, [selectedVoucher, subtotalCart]);

      const finalTotalAmount = useMemo(() => Math.max(0, subtotalCart - discountAmount), [subtotalCart, discountAmount]);

      const handleClaimQR = (qrCodeToScan) => {
        if (!currentUser) {
          setIsLoginModalOpen(true);
          showToast('Silakan login terlebih dahulu untuk klaim poin', 'error');
          return;
        }

        const code = qrCodeToScan || scanQRInput;
        if (!code) return showToast('Masukkan kode QR struk terlebih dahulu', 'error');

        const targetOrderIndex = orders.findIndex(o => o.qrReceiptCode === code);
        if (targetOrderIndex === -1) return showToast('Kode QR Struk tidak valid!', 'error');

        const targetOrder = orders[targetOrderIndex];
        if (targetOrder.qrClaimed || (currentUser.claimedQRs && currentUser.claimedQRs.includes(code))) {
          return showToast('Kode QR ini sudah pernah dipindai!', 'error');
        }

        const earned = targetOrder.pointsEarned || Math.floor(targetOrder.totalAmount / 1000);
        const updatedUser = {
          ...currentUser,
          points: currentUser.points + earned,
          claimedQRs: [...(currentUser.claimedQRs || []), code]
        };

        setCurrentUser(updatedUser);
        syncUserToSpreadsheet(updatedUser);

        const updatedOrders = [...orders];
        updatedOrders[targetOrderIndex].qrClaimed = true;
        setOrders(updatedOrders);

        setScanQRInput('');
        setQrModalOpen(false);
        showToast(`Selamat! +${earned} Poin ditambahkan ke akun Anda. 🎉`);
      };

      const handleRedeemReward = (reward) => {
        if (!currentUser) {
          setIsLoginModalOpen(true);
          showToast('Silakan login terlebih dahulu untuk menukarkan poin', 'error');
          return;
        }

        if (currentUser.points < reward.points) {
          showToast('Poin Anda tidak mencukupi untuk hadiah ini!', 'error');
          return;
        }

        const newVoucher = {
          id: `v_reward_${Date.now()}`,
          name: reward.name,
          code: `RW-${Math.floor(1000 + Math.random() * 9000)}`,
          discountAmount: reward.discountAmount || 15000,
          type: 'fixed'
        };

        const updatedUser = {
          ...currentUser,
          points: currentUser.points - reward.points,
          myVouchers: [...(currentUser.myVouchers || []), newVoucher]
        };

        setCurrentUser(updatedUser);
        syncUserToSpreadsheet(updatedUser);
        showToast(`Berhasil menukarkan "${reward.name}"! Voucher tersimpan.`);
      };

        const cashOrders = orders.filter(o => o.status === 'Lunas' && o.paymentMethod === 'Tunai');
        const qrisOrders = orders.filter(o => o.status === 'Lunas' && o.paymentMethod !== 'Tunai');

        const totalCashIn = cashOrders.reduce((sum, o) => sum + o.totalAmount, 0);
        const totalQrisIn = qrisOrders.reduce((sum, o) => sum + o.totalAmount, 0);
        const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);

        const modalAwal = shiftState.isOpen ? (shiftState.modalAwal || 0) : 0;
        const totalFisik = modalAwal + totalCashIn - totalExpenses;
        const omsetKotor = totalCashIn + totalQrisIn;
        const omsetBersih = omsetKotor - totalExpenses;

        return {
          totalCashIn,
          totalQrisIn,
          totalExpenses,
          modalAwal,
          totalFisik,
          omsetKotor,
          omsetBersih
        };
      }, [orders, expenses, shiftState]);

                  <div>
                    <label className="text-[11px] font-bold block mb-1">Kode Promo</label>
                    <input name="code" defaultValue={adminPromoModal.item?.code || ''} placeholder="GOLD20" required className="w-full p-2.5 rounded-xl border text-xs font-mono uppercase dark:bg-slate-800 outline-none" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Tipe Diskon</label>
                    <select name="type" defaultValue={adminPromoModal.item?.type || 'fixed'} className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800 outline-none">
                      <option value="fixed">Nominal (Rp)</option>
                      <option value="percent">Persentase (%)</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">Nilai Potongan (Rp atau %)</label>
                  <input name="val" type="number" defaultValue={adminPromoModal.item?.discountAmount || adminPromoModal.item?.discountPercent || 10000} required className="w-full p-2.5 rounded-xl border text-xs dark:bg-slate-800 outline-none" />
                </div>

                <button type="submit" className="w-full bg-[#0B8F5A] text-white py-3 rounded-xl font-bold text-xs shadow">Simpan Kode Promo</button>
              </form>
            </div>
          )}

          {/* MODAL 11: PIN KEAMANAN MENU KASIR (KODE: 1122) */}
          {isPinModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-xs w-full p-6 space-y-4 shadow-2xl text-center">
                
                <div className="flex justify-between items-center pb-1">
                  <div className="w-10 h-10 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center mx-auto mb-1">
                    <Lock className="w-6 h-6" />
                  </div>
                  <button onClick={() => setIsPinModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div>
                  <h3 className="text-base font-extrabold text-slate-800 dark:text-slate-100">PIN Keamanan Kasir</h3>
                  <p className="text-[11px] text-slate-400 mt-1">Akses khusus kasir & owner. Masukkan 4 digit PIN.</p>
                </div>

                {/* Display Dots PIN */}
                <div className="flex justify-center items-center gap-3 py-2">
                  {[0, 1, 2, 3].map(i => (
                    <div 
                      key={i} 
                      className={`w-4 h-4 rounded-full border-2 transition-all ${pinInput.length > i ? 'bg-[#0B8F5A] border-[#0B8F5A] scale-110' : 'border-slate-300 dark:border-slate-700 bg-transparent'}`}
                    />
                  ))}
                </div>

                {pinError && (
                  <p className="text-xs text-rose-500 font-bold animate-pulse">{pinError}</p>
                )}

                {/* Keyboard Numpad Layar Sentuh */}
                <div className="grid grid-cols-3 gap-2 pt-2">
                  {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => {
                        if (pinInput.length < 4) {
                          const nextPin = pinInput + num;
                          setPinInput(nextPin);
                          setPinError('');
                          if (nextPin.length === 4) handleVerifyPin(nextPin);
                        }
                      }}
                      className="h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white font-extrabold text-base active:bg-[#0B8F5A] active:text-white transition shadow-sm"
                    >
                      {num}
                    </button>
                  ))}

                  <button
                    type="button"
                    onClick={() => { setPinInput(''); setPinError(''); }}
                    className="h-12 rounded-2xl bg-slate-200 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 font-bold text-xs"
                  >
                    Hapus
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      if (pinInput.length < 4) {
                        const nextPin = pinInput + '0';
                        setPinInput(nextPin);
                        setPinError('');
                        if (nextPin.length === 4) handleVerifyPin(nextPin);
                      }
                    }}
                    className="h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white font-extrabold text-base active:bg-[#0B8F5A] active:text-white transition shadow-sm"
                  >
                    0
                  </button>

                  <button
                    type="button"
                    onClick={() => handleVerifyPin()}
                    className="h-12 rounded-2xl bg-[#0B8F5A] text-white font-bold text-xs shadow-md"
                  >
                    Masuk
                  </button>
                </div>

                <p className="text-[10px] text-slate-400 pt-1 font-mono">
                  Default PIN Kasir: <strong>1122</strong>
                </p>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
